name: Feature request
description: Suggest an improvement to MCCI CONNECT.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, permission, or accessibility considerations
