name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check app tests tools
      - run: ruff format --check app tests tools
      - run: mypy app
      - run: python -m pytest -q
      - run: python -m compileall -q app
      - run: node --check app/static/app.js
      - run: python -m build --no-isolation
      - run: python tools/check_wheel.py
      - run: pip-audit -r requirements-dev.lock
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
